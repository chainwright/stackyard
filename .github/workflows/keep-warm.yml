# Keep the free Render instance warm (TASK-32f). It used to be a pinger on one
# Mac, a single point of failure. This pings the public health endpoint, which
# makes no model call. No secrets, and the job may read nothing in the repo.
# GitHub may delay or skip scheduled runs when it is busy, so a cold start after
# a quiet spell is still possible.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (one retry)
        run: |
          curl -fsS --max-time 90 https://stackyard-sdqt.onrender.com/api/health \
            || (sleep 20 && curl -fsS --max-time 90 https://stackyard-sdqt.onrender.com/api/health)
