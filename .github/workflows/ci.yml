name: CI

# Runs the full test suite, strict type-check, the player-bundle freshness check
# and the README claim checker on every push and pull request (TASK-22 l — the
# README's CI claim is real, not aspirational; TASK-26l — the claim checker runs
# here too, because a README that says 600 tests while the suite has 619 was
# exactly the drift it exists to catch, and nothing ran it).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Type-check (strict)
        run: npx tsc --noEmit
      - name: Tests (rebuilds the player bundle, then runs Vitest)
        run: npm test
      - name: Player bundle is fresh
        run: ./scripts/check-player-fresh.sh
      - name: Sample lessons are fresh (samples/ matches a fresh export)
        run: npm run check:samples
      - name: README numbers match the code (tests, bundle size, invariants, build command)
        run: npm run check:claims
