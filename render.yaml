# render.yaml — Render blueprint for the one public Stackyard web service.
# One web service serves the built Maker SPA and the /api routes from the same
# Node process. The paid model key is set in the Render dashboard (sync: false),
# never committed.
#
# Deploy: push this repo to a Git remote, then "New > Blueprint" in Render and
# point it at the repo. Set STACKYARD_LLM_API_KEY in the dashboard.

services:
  - type: web
    name: stackyard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:player && npm run build:living && npm run build:maker
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # The paid model key — set in the Render dashboard, never synced from here.
      - key: STACKYARD_LLM_API_KEY
        sync: false
      # OpenAI-compatible endpoint + model (safe to keep in the blueprint). The live demo
      # uses Anthropic's OpenAI-compatible API.
      - key: STACKYARD_LLM_BASE_URL
        value: https://api.anthropic.com/v1/
      - key: STACKYARD_LLM_MODEL
        value: claude-haiku-5-5
      # Render terminates TLS at its proxy and sets X-Forwarded-For, so trust it
      # for per-client rate limiting. The limiter keys on the RIGHTMOST
      # X-Forwarded-For entry (the one Render appends), not the client-sent
      # leftmost one. If Render is fronted by a provider that sets a single-value
      # client-IP header (e.g. cf-connecting-ip), set CLIENT_IP_HEADER to it.
      # Anthropic's OpenAI-compatible endpoint rejects response_format json_object
      # ("Input should be 'json_schema'"), found on the first live call (5 Nov).
      - key: STACKYARD_LLM_JSON_MODE
        value: "off"
      # and the model rejects `temperature` ("deprecated for this model").
      - key: STACKYARD_LLM_TEMPERATURE
        value: "off"
      # and pretty-prints a 10-card stack past 4096 output tokens.
      - key: STACKYARD_LLM_MAX_TOKENS
        value: "12000"
      # Thinking off. Measured 9 Nov with this exact config (claude-haiku-5-5, a 12-card
      # water-cycle sentence, local server): with thinking on, Build Cards to editor took
      # 30.5 s and 33.5 s because the model is silent for 20 to 24 s before its first text;
      # with "thinking": {"type": "disabled"} the first text arrived at 0.58 s and the whole
      # stack at 11.0 s. (reasoning_effort "low" did not help.) This is also the default
      # for the host api.anthropic.com; it is set here so the choice is explicit.
      - key: STACKYARD_LLM_THINKING
        value: "off"
      - key: TRUST_PROXY
        value: "1"
      # Render sits behind Cloudflare. Measured on the live service (5 Nov): the
      # X-Forwarded-For chain is "<visitor-supplied>, <client>, <cloudflare>, <render
      # internal>", so the rightmost entry is the same internal address for everyone.
      # cf-connecting-ip carries the real client and Cloudflare overwrites it.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DEBUG_CLIENT_ADDR
        value: "0"
      - key: NODE_VERSION
        value: "24"
