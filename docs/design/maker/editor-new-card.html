<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — New card picker</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   The New card picker: Quiz / Flash / Story, each with a tiny
   preview. Shown as a modal over the editor desk. Self-hosted fonts.
   ============================================================ */
/* Fonts: Bricolage Grotesque (c)2022 Bricolage Project Authors, OFL-1.1, no RFN.
   'Stackyard Reading' = Latin subset of Atkinson Hyperlegible (c)2020 Braille
   Institute, OFL-1.1 with Reserved Font Names 'Atkinson'/'Hyperlegible'; the
   subset is a Modified Version, renamed to avoid the RFN. See fonts/OFL-*.txt. */
@font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:700 800; font-display:swap; src:url('fonts/bricolage.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/reading-400.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/reading-700.woff2') format('woff2'); }

:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926;
  --color-tile-a:#F2735F; --color-tile-b:#F6C744; --color-tile-c:#26A69A; --color-tile-d:#1E2A47;
  --color-white:#FFFFFF; --color-desk:#C9A47C; --shell-sub:#E0E6F0;
  --radius-card:10px; --radius-tile:12px; --radius-button:10px;
  --text-question:44px; --text-body:22px; --text-meta:20px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Stackyard Reading','Atkinson Hyperlegible','Arial',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
button, input, select, textarea { font: inherit; color: inherit; }
html, body { height:100%; background:var(--color-paper); color:var(--color-ink); font-family:var(--font-body); font-size:18px; -webkit-font-smoothing:antialiased; }
button:focus-visible { outline:3px solid var(--color-ink); outline-offset:2px; }

.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.topbar { flex:0 0 auto; background:var(--color-ink); display:flex; align-items:center; gap:20px; height:56px; padding:0 24px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:30px; color:var(--color-paper); line-height:1; flex-shrink:0; }
.stack-desc { font-family:var(--font-body); font-weight:400; font-size:18px; color:var(--shell-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }

.desk { flex:1 1 auto; position:relative; background:var(--color-desk); background-image:repeating-linear-gradient(90deg, rgba(30,42,71,.025) 0 2px, transparent 2px 9px); overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0; }
/* The editor card behind the modal, so the backdrop isn't empty desk */
.ghost-stack { position:absolute; width:620px; height:466px; }
.ghost-edge { position:absolute; width:620px; height:466px; border-radius:var(--radius-card); border:1px solid #D8CDB6; background:var(--color-paper); }
.ghost-edge.g1 { transform:translate(6px,6px); background:#F4EFE3; }
.ghost-edge.g2 { transform:translate(12px,12px); background:#EDE6D6; }
.ghost-card { position:absolute; width:620px; height:466px; border-radius:var(--radius-card); background:var(--color-paper); border:1px solid var(--color-rule); }
.overlay { position:absolute; inset:0; background:rgba(30,42,71,0.45); display:flex; align-items:center; justify-content:center; padding:24px; }

.picker { position:relative; width:760px; max-width:94vw; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:0 4px 0 rgba(30,42,71,.18); padding:36px 40px 40px; }
.picker h1 { font-family:var(--font-head); font-weight:800; font-size:32px; line-height:1.2; margin-bottom:6px; }
.picker p.sub { font-size:18px; color:#4a5878; margin-bottom:24px; }

.choices { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
.choice { display:flex; flex-direction:column; gap:12px; background:var(--color-paper); border:2px solid var(--color-ink); border-bottom-width:5px; border-radius:12px; padding:16px; cursor:pointer; text-align:left; }
.choice:hover { background:#fff; }
.choice .name { font-family:var(--font-head); font-weight:800; font-size:22px; }
.choice .desc { font-size:18px; color:#4a5878; line-height:1.3; }

/* Tiny preview of each card kind */
.mini { height:120px; background:#fff; border:1px solid var(--color-rule); border-radius:8px; overflow:hidden; position:relative; padding:10px 12px; }
.mini .mq { font-family:var(--font-head); font-weight:800; font-size:14px; color:var(--color-ink); line-height:1.2; margin-bottom:8px; }
.mini .mtiles { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.mini .mt { height:24px; border-radius:5px; }
.mini .mterm { display:flex; align-items:center; justify-content:center; height:100%; font-family:var(--font-head); font-weight:800; font-size:22px; color:var(--color-ink); }
.mini .mbtns { display:flex; flex-direction:column; gap:8px; margin-top:18px; }
.mini .mb { height:26px; border:2px solid var(--color-ink); border-bottom-width:3px; border-radius:6px; }

.picker-foot { display:flex; justify-content:flex-end; margin-top:24px; }
.cancel-btn { background:var(--color-paper); color:var(--color-ink); border:2px solid var(--color-ink); border-radius:var(--radius-button); padding:12px 24px; font-family:var(--font-body); font-weight:700; font-size:18px; cursor:pointer; min-height:44px; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
    <span class="stack-desc">A 10-card quiz about the Vikings in Ireland — the right answer plays a cheer</span>
  </header>

  <main class="desk">
    <!-- The editor card stack, dimmed behind the modal -->
    <div class="ghost-stack" aria-hidden="true">
      <div class="ghost-edge g2"></div>
      <div class="ghost-edge g1"></div>
      <div class="ghost-card"></div>
    </div>
    <div class="overlay">
      <section class="picker" role="dialog" aria-label="Add a card" aria-modal="true">
        <h1>Add a card</h1>
        <p class="sub">Pick the kind of card to add after card 3.</p>

        <div class="choices">
          <button class="choice" type="button">
            <div class="mini" aria-hidden="true">
              <div class="mq">A question with answers</div>
              <div class="mtiles">
                <span class="mt" style="background:var(--color-tile-a);"></span>
                <span class="mt" style="background:var(--color-tile-b);"></span>
                <span class="mt" style="background:var(--color-tile-c);"></span>
                <span class="mt" style="background:var(--color-tile-d);"></span>
              </div>
            </div>
            <span class="name">Quiz</span>
            <span class="desc">A question with four answers. One is right.</span>
          </button>

          <button class="choice" type="button">
            <div class="mini" aria-hidden="true"><div class="mterm">Term</div></div>
            <span class="name">Flash</span>
            <span class="desc">A term on the front, the answer on the back.</span>
          </button>

          <button class="choice" type="button">
            <div class="mini" aria-hidden="true">
              <div class="mq">A choice to make</div>
              <div class="mbtns"><span class="mb"></span><span class="mb"></span></div>
            </div>
            <span class="name">Story</span>
            <span class="desc">Text with buttons that branch to other cards.</span>
          </button>
        </div>

        <div class="picker-foot">
          <button class="cancel-btn" type="button">Cancel</button>
        </div>
      </section>
    </div>
  </main>

  <div class="sr-only">Choose a card kind: Quiz, Flash or Story.</div>
</div>
</body>
</html>
