<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — Play (wrong answer)</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   Play mode, wrong-answer state: the tile shakes, then a faint ✗
   settles in stamp red at 40%. No CORRECT stamp. Self-hosted fonts.
   ============================================================ */
/* Fonts: Bricolage Grotesque (c)2022 Bricolage Project Authors, OFL-1.1, no RFN.
   'Stackyard Reading' = Latin subset of Atkinson Hyperlegible (c)2020 Braille
   Institute, OFL-1.1 with Reserved Font Names 'Atkinson'/'Hyperlegible'; the
   subset is a Modified Version, renamed to avoid the RFN. See fonts/OFL-*.txt. */
@font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:700 800; font-display:swap; src:url('fonts/bricolage.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/reading-400.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/reading-700.woff2') format('woff2'); }

:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926;
  --color-tile-a:#F2735F; --color-tile-b:#F6C744; --color-tile-c:#26A69A; --color-tile-d:#1E2A47;
  --color-white:#FFFFFF; --color-desk:#C9A47C;
  --radius-card:10px; --radius-tile:12px; --tile-min-height:56px;
  --text-question:44px; --text-tile:32px; --text-meta:20px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Stackyard Reading','Atkinson Hyperlegible','Arial',sans-serif;
  --card-scale:1;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
button, input, select, textarea { font: inherit; color: inherit; }
html, body { height:100%; background:var(--color-desk); color:var(--color-ink); font-family:var(--font-body); font-size:18px; -webkit-font-smoothing:antialiased; }
button:focus-visible { outline:3px solid var(--color-ink); outline-offset:2px; }

.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.topbar { flex:0 0 auto; background:var(--color-ink); display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:64px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:30px; color:var(--color-paper); }
.score { display:inline-flex; align-items:center; gap:12px; font-family:var(--font-head); font-weight:800; font-size:36px; color:var(--color-paper); }

.stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden; min-height:0; background-image:repeating-linear-gradient(90deg, rgba(30,42,71,.025) 0 2px, transparent 2px 9px); }
.stage-scale { width:calc(820px * var(--card-scale)); height:calc(640px * var(--card-scale)); flex:0 0 auto; }
.stage-scale > .sy-card-stack { transform:scale(var(--card-scale)); transform-origin:top left; }

.sy-card-stack { position:relative; width:800px; height:600px; }
.sy-card-edge { position:absolute; top:0; left:0; width:800px; height:600px; border-radius:var(--radius-card); border:1px solid #D8CDB6; box-shadow:0 2px 0 rgba(30,42,71,.10); pointer-events:none; }
.sy-card-edge-1 { transform:translate(6px,6px); background:#F4EFE3; z-index:1; }
.sy-card-edge-2 { transform:translate(12px,12px); background:#EDE6D6; z-index:0; }
.sy-card-edge-3 { transform:translate(18px,18px); background:#E6DDC9; z-index:-1; }
.sy-card { position:absolute; top:0; left:0; width:800px; height:600px; border-radius:var(--radius-card); background-color:var(--color-paper); border:1px solid var(--color-rule); box-shadow:0 2px 0 rgba(30,42,71,.10); overflow:visible; z-index:2; }
.sy-card::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0; background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px); background-position:0 40px; background-size:100% calc(100% - 40px); }
.sy-rings { position:absolute; top:-22px; left:0; width:800px; height:52px; display:flex; justify-content:center; gap:240px; pointer-events:none; z-index:12; }
.sy-ring svg { display:block; }

.sy-element { position:absolute; z-index:1; }
.sy-meta { font-size:var(--text-meta); font-family:var(--font-body); font-weight:400; line-height:1.6; color:var(--color-ink); }
.sy-question { font-size:var(--text-question); font-family:var(--font-head); font-weight:800; line-height:64px; color:var(--color-ink); }

.sy-tile { position:relative; display:flex; align-items:center; gap:12px; border:none; border-radius:var(--radius-tile); padding:0 20px; min-height:var(--tile-min-height); font-size:var(--text-tile); font-family:var(--font-body); font-weight:700; line-height:1.3; width:100%; height:100%; text-align:left; }
.sy-tile .tile-label { flex:1 1 auto; }
.sy-tile-shape { flex-shrink:0; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }

/* Wrong: the chosen tile shakes once; a faint ✗ settles after */
.sy-tile.wrong { animation:tile-shake 180ms ease-in-out 1; }
@keyframes tile-shake { 0%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}100%{transform:translateX(0);} }
@media (prefers-reduced-motion: reduce) { .sy-tile.wrong { animation:none; } }
/* Wrong ✗ stamp: full strength, straddling the tile's top edge, mostly
   over paper (stamp red on paper = 4.67:1, passes AA). Same placement as
   the CORRECT stamp so the signal reads even on a washed-out projector. */
.sy-wrong-mark { position:absolute; top:-24px; left:64px; transform:rotate(-8deg); color:var(--color-stamp); opacity:1; font-family:var(--font-head); font-weight:800; font-size:44px; line-height:1; border:3px solid var(--color-stamp); border-radius:4px; padding:0 10px; background:transparent; mix-blend-mode:multiply; z-index:20; pointer-events:none; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
    <span class="score" aria-label="Score 2">
      <span aria-hidden="true"><svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><line x1="3" y1="9" x2="19" y2="9" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/><line x1="6" y1="14" x2="19" y2="14" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/><line x1="3" y1="19" x2="19" y2="19" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/></svg></span>
      Score 2
      <span aria-hidden="true"><svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><line x1="3" y1="9" x2="19" y2="9" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/><line x1="3" y1="14" x2="16" y2="14" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/><line x1="3" y1="19" x2="19" y2="19" stroke="#FBF8F1" stroke-width="3" stroke-linecap="round"/></svg></span>
    </span>
  </header>

  <main class="stage" aria-label="Card">
    <div class="stage-scale">
      <div class="sy-card-stack">
        <div class="sy-card-edge sy-card-edge-1"></div>
        <div class="sy-card-edge sy-card-edge-2"></div>
        <div class="sy-card-edge sy-card-edge-3"></div>
        <div class="sy-card">
          <div class="sy-rings" aria-hidden="true">
            <span class="sy-ring"><svg width="26" height="52" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
            <span class="sy-ring"><svg width="26" height="52" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
          </div>
          <div class="sy-element" style="left:48px; top:48px; width:400px; height:32px;"><p class="sy-meta">Card 3 of 10</p></div>
          <div class="sy-element" style="left:48px; top:104px; width:704px; height:128px;"><p class="sy-question">Where did the Vikings build a town in 841?</p></div>

          <div class="sy-element" style="left:48px; top:296px; width:344px; height:96px;">
            <button class="sy-tile" style="background-color:var(--color-tile-a); color:var(--color-ink);" type="button"><span class="sy-tile-shape" style="color:var(--color-ink);"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><polygon points="14,2 26,26 2,26" fill="currentColor"/></svg></span><span class="tile-label">Dublin</span></button>
          </div>
          <!-- Cork chosen (wrong): shakes, faint ✗ settles -->
          <div class="sy-element" style="left:408px; top:296px; width:344px; height:96px;">
            <button class="sy-tile wrong" style="background-color:var(--color-tile-b); color:var(--color-ink);" type="button"><span class="sy-tile-shape" style="color:var(--color-ink);"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><polygon points="14,2 26,14 14,26 2,14" fill="currentColor"/></svg></span><span class="tile-label">Cork</span><span class="sy-wrong-mark" aria-hidden="true">✗</span></button>
          </div>
          <div class="sy-element" style="left:48px; top:424px; width:344px; height:96px;">
            <button class="sy-tile" style="background-color:var(--color-tile-c); color:var(--color-ink);" type="button"><span class="sy-tile-shape" style="color:var(--color-ink);"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="currentColor"/></svg></span><span class="tile-label">Galway</span></button>
          </div>
          <div class="sy-element" style="left:408px; top:424px; width:344px; height:96px;">
            <button class="sy-tile" style="background-color:var(--color-tile-d); color:var(--color-white);" type="button"><span class="sy-tile-shape" style="color:var(--color-white);"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" fill="currentColor"/></svg></span><span class="tile-label">Sligo</span></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="sr-only" aria-live="polite">Not quite. Try the next card.</div>
</div>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var root = document.documentElement;
  function fit() { var w=stage.clientWidth,h=stage.clientHeight; var s=Math.min((w-48)/800,(h-48)/600); root.style.setProperty('--card-scale', Math.max(0.5,s).toFixed(3)); }
  fit(); window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
