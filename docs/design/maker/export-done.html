<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — File exported</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   Static mockup: the download-triggered confirmation.
   No build step, no framework, no external URLs.
   ============================================================ */
:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926; --color-stamp-hover:#B8321F;
  --color-white:#FFFFFF; --color-desk:#D4C9B0; --shell-sub:#E0E6F0;
  --radius-card:10px; --radius-button:10px;
  --text-question:44px; --text-body:22px; --text-meta:18px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Atkinson Hyperlegible','Arial',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--color-paper); color:var(--color-ink); font-family:var(--font-body); font-size:18px; }
button:focus-visible, a:focus-visible { outline:3px solid var(--color-ink); outline-offset:2px; }

.app { display:flex; flex-direction:column; min-height:100vh; }
.topbar { background:var(--color-ink); display:flex; align-items:center; gap:24px; padding:14px 28px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:24px; color:var(--color-paper); }
.stack-desc { font-family:var(--font-body); font-weight:400; font-size:18px; color:var(--shell-sub); max-width:560px; line-height:1.5; }

.stage { flex:1; background:var(--color-desk); display:flex; align-items:center; justify-content:center; padding:32px; }

.done-card { position:relative; width:640px; max-width:92vw; background:var(--color-paper); border:1.5px solid var(--color-rule); border-radius:var(--radius-card); padding:56px 56px 48px; text-align:center; }
.done-card::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0; border-radius:var(--radius-card); background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px); background-position:0 40px; background-size:100% calc(100% - 40px); opacity:0.5; }
.ring-holes { position:absolute; top:0; left:0; width:100%; display:flex; justify-content:space-around; padding:0 220px; z-index:2; }
.ring-hole { width:20px; height:20px; border-radius:50%; background:var(--color-white); border:1px solid var(--color-rule); margin-top:6px; }
.done-inner { position:relative; z-index:3; }

/* The rubber stamp — one of the three allowed uses of --color-stamp */
.stamp {
  display:inline-block; margin:0 auto 24px;
  font-family:var(--font-head); font-weight:800; font-size:28px;
  text-transform:uppercase; color:var(--color-stamp);
  border:3px solid var(--color-stamp); border-radius:4px;
  padding:6px 14px; transform:rotate(-8deg); opacity:0.92;
}

.done-card h1 { font-family:var(--font-head); font-weight:800; font-size:var(--text-question); line-height:1.3; margin-bottom:12px; }
.done-card p { font-size:var(--text-body); line-height:1.5; margin-bottom:12px; }

.filename { display:inline-block; font-family:var(--font-body); font-weight:700; font-size:18px; color:var(--color-ink); background:#fff; border:1.5px solid var(--color-rule); border-radius:var(--radius-button); padding:10px 16px; margin:8px 0 28px; }

.actions { display:flex; align-items:center; justify-content:center; gap:16px; }
.ghost-btn { background:var(--color-paper); color:var(--color-ink); border:2px solid var(--color-ink); border-radius:var(--radius-button); padding:12px 24px; font-family:var(--font-body); font-weight:700; font-size:18px; cursor:pointer; min-height:44px; }
.export-btn { display:inline-flex; align-items:center; gap:10px; background:var(--color-stamp); color:var(--color-white); border:none; border-radius:var(--radius-button); padding:12px 24px; font-family:var(--font-body); font-weight:700; font-size:18px; cursor:pointer; min-height:44px; }
.export-btn:hover { background:var(--color-stamp-hover); }
.export-btn svg { width:20px; height:20px; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
    <span class="stack-desc">A 10-card quiz about the Vikings in Ireland — the right answer plays a cheer</span>
  </header>

  <main class="stage">
    <section class="done-card" aria-label="File exported">
      <div class="ring-holes" aria-hidden="true">
        <div class="ring-hole"></div>
        <div class="ring-hole"></div>
      </div>
      <div class="done-inner">
        <span class="stamp" aria-hidden="true">Exported &#10003;</span>
        <h1>Your file is ready</h1>
        <p>We've saved your set of cards as one file. Open it on any laptop — no internet needed.</p>
        <span class="filename">Vikings-in-Ireland.html</span>
        <div class="actions">
          <button class="ghost-btn" type="button">Back to Editing</button>
          <button class="export-btn" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v9m0 0l-4-4m4 4l4-4M3 15v2a1 1 0 001 1h12a1 1 0 001-1v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export Again
          </button>
        </div>
      </div>
    </section>
  </main>

  <div class="sr-only" aria-live="polite">Your file is ready. Saved as Vikings-in-Ireland.html.</div>
</div>
</body>
</html>
