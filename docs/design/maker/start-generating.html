<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — Start (building)</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   Static mockup. No build step, no framework, no external URLs.
   The deal-in sequence: the sentence turns into cards, each landing
   with its real generated question already written on it.
   ============================================================ */
/* Fonts: Bricolage Grotesque (c)2022 Bricolage Project Authors, OFL-1.1, no RFN.
   'Stackyard Reading' = Latin subset of Atkinson Hyperlegible (c)2020 Braille
   Institute, OFL-1.1 with Reserved Font Names 'Atkinson'/'Hyperlegible'; the
   subset is a Modified Version, renamed to avoid the RFN. See fonts/OFL-*.txt. */
@font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:700 800; font-display:swap; src:url('fonts/bricolage.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/reading-400.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/reading-700.woff2') format('woff2'); }

:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926;
  --color-tile-a:#F2735F; --color-tile-b:#F6C744; --color-tile-c:#26A69A; --color-tile-d:#1E2A47;
  --color-white:#FFFFFF; --color-desk:#C9A47C; --shell-sub:#E0E6F0;
  --radius-card:10px; --radius-tile:12px; --radius-button:10px;
  --text-question:44px; --text-tile:32px; --text-body:22px; --text-meta:20px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Stackyard Reading','Atkinson Hyperlegible','Arial',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
button, input, select, textarea { font: inherit; color: inherit; }
html, body { height:100%; background:var(--color-paper); color:var(--color-ink); font-family:var(--font-body); font-size:18px; -webkit-font-smoothing:antialiased; }

.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.topbar { flex:0 0 auto; background:var(--color-ink); display:flex; align-items:center; gap:18px; height:56px; padding:0 28px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:30px; color:var(--color-paper); line-height:1; flex-shrink:0; }
.topbar .promise { font-family:var(--font-body); font-weight:400; font-size:18px; color:var(--shell-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.build-area { flex:1 1 auto; background:var(--color-desk); background-image:repeating-linear-gradient(90deg, rgba(30,42,71,.025) 0 2px, transparent 2px 9px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:32px; overflow:hidden; min-height:0; }

.status { text-align:center; }
.status h1 { font-family:var(--font-head); font-weight:800; font-size:36px; line-height:1.2; color:var(--color-ink); margin-bottom:8px; }
.status p { font-size:var(--text-body); line-height:1.5; color:var(--color-ink); }
.counter { font-family:var(--font-head); font-weight:800; font-size:var(--text-meta); color:var(--color-ink); margin-top:6px; }

/* The deal-in stack: dealt cards fanned behind, newest landing on top */
.deal { position:relative; width:560px; height:360px; }
.deal-card { position:absolute; left:0; top:0; width:520px; height:320px; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:0 2px 0 rgba(30,42,71,.10); overflow:hidden; padding:24px 28px; }
.deal-card::after { content:''; position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px); background-position:0 28px; }
.deal-num { position:relative; z-index:1; font-family:var(--font-body); font-weight:400; font-size:var(--text-meta); color:#4a5878; margin-bottom:10px; }
.deal-q { position:relative; z-index:1; font-family:var(--font-head); font-weight:800; font-size:26px; line-height:1.25; color:var(--color-ink); margin-bottom:14px; }
/* Quiz answer blocks filling in, so you can see it's building a quiz */
.deal-tiles { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.deal-tile { height:40px; border-radius:8px; }
/* Metal rings standing above each dealt card */
.deal-rings { position:absolute; top:-18px; left:0; width:100%; display:flex; justify-content:center; gap:200px; z-index:2; }
.deal-rings svg { display:block; }

/* fanned, each a little offset + rotated, like cards dealt onto a pile */
.deal-card.c1 { transform:translate(40px,40px) rotate(-5deg); z-index:1; }
.deal-card.c2 { transform:translate(30px,28px) rotate(3deg);  z-index:2; }
.deal-card.c3 { transform:translate(20px,16px) rotate(-2deg); z-index:3; }
.deal-card.c4 { transform:translate(0,0) rotate(1.5deg);      z-index:4; animation:land 240ms ease-out; overflow:visible; }
@keyframes land { from { transform:translate(-10px,-14px) rotate(5deg); opacity:0.6; } to { transform:translate(0,0) rotate(1.5deg); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .deal-card.c4 { animation:none; } }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
    <span class="promise">Make a clickable lesson from one sentence. Works offline.</span>
  </header>

  <main class="build-area" aria-busy="true" aria-label="Building your cards">
    <div class="status">
      <h1>Building your cards…</h1>
      <p>About 20 seconds. Each card appears as it's ready.</p>
      <p class="counter" aria-live="polite">4 of 10</p>
    </div>

    <!-- The cards deal out one by one, each with its real question -->
    <div class="deal" aria-hidden="true">
      <div class="deal-card c1"><p class="deal-num">Card 1 · ready</p></div>
      <div class="deal-card c2"><p class="deal-num">Card 2 · ready</p></div>
      <div class="deal-card c3"><p class="deal-num">Card 3 · ready</p></div>
      <div class="deal-card c4">
        <div class="deal-rings">
          <span><svg width="22" height="44" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
          <span><svg width="22" height="44" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
        </div>
        <p class="deal-num">Card 4</p>
        <p class="deal-q">Who led the first Viking raid?</p>
        <div class="deal-tiles">
          <span class="deal-tile" style="background:var(--color-tile-a);"></span>
          <span class="deal-tile" style="background:var(--color-tile-b);"></span>
          <span class="deal-tile" style="background:var(--color-tile-c);"></span>
          <span class="deal-tile" style="background:var(--color-tile-d);"></span>
        </div>
      </div>
    </div>
  </main>

  <div class="sr-only" aria-live="polite">Building your cards. 4 of 10 ready.</div>
</div>
</body>
</html>
