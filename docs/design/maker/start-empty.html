<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — Start (empty)</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   Static mockup. No build step, no framework, no external URLs.
   ============================================================ */
:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926; --color-stamp-hover:#B8321F;
  --color-white:#FFFFFF; --color-desk:#D4C9B0; --shell-sub:#E0E6F0;
  --radius-card:10px; --radius-button:10px;
  --text-question:44px; --text-body:22px; --text-meta:18px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Atkinson Hyperlegible','Arial',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--color-paper); color:var(--color-ink); font-family:var(--font-body); font-size:18px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--color-ink); outline-offset:2px; }

.app { display:flex; flex-direction:column; min-height:100vh; }
.topbar { background:var(--color-ink); display:flex; align-items:center; gap:24px; padding:14px 28px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:24px; color:var(--color-paper); }

.start-area { flex:1; background:var(--color-desk); display:flex; align-items:center; justify-content:center; padding:32px; }

/* The Start card looks like a sheet of paper on the desk */
.start-card {
  position:relative;
  width:720px; max-width:92vw;
  background:var(--color-paper);
  border:1.5px solid var(--color-rule);
  border-radius:var(--radius-card);
  padding:56px 56px 48px;
}
.start-card::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  border-radius:var(--radius-card);
  background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px);
  background-position:0 40px; background-size:100% calc(100% - 40px); opacity:0.5;
}
.start-ring-holes { position:absolute; top:0; left:0; width:100%; display:flex; justify-content:space-around; padding:0 240px; z-index:2; }
.start-ring-hole { width:20px; height:20px; border-radius:50%; background:var(--color-white); border:1px solid var(--color-rule); margin-top:6px; }
.start-inner { position:relative; z-index:3; }

.start-card h1 { font-family:var(--font-head); font-weight:800; font-size:var(--text-question); line-height:1.3; margin-bottom:12px; }
.start-card p.lede { font-size:var(--text-body); line-height:1.5; margin-bottom:28px; color:var(--color-ink); }

label.field-label { display:block; font-size:18px; font-weight:700; margin-bottom:8px; }
.sentence {
  width:100%; min-height:88px; resize:vertical;
  font-family:var(--font-body); font-size:var(--text-body); line-height:1.5;
  color:var(--color-ink); background:#fff;
  border:1.5px solid var(--color-rule); border-radius:var(--radius-button);
  padding:14px 16px;
}
.sentence::placeholder { color:#8A93A8; }

.actions { display:flex; align-items:center; gap:16px; margin-top:24px; }
.build-btn {
  background:var(--color-ink); color:var(--color-paper); border:none;
  border-radius:var(--radius-button); padding:14px 28px;
  font-family:var(--font-body); font-weight:700; font-size:18px;
  cursor:pointer; min-height:44px;
}
.build-btn[disabled] { background:#E4DFD3; color:#8A8577; cursor:not-allowed; }
.hint { font-size:18px; color:#4a5878; line-height:1.4; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
  </header>

  <main class="start-area">
    <section class="start-card" aria-label="Start a new set of cards">
      <div class="start-ring-holes" aria-hidden="true">
        <div class="start-ring-hole"></div>
        <div class="start-ring-hole"></div>
      </div>
      <div class="start-inner">
        <h1>What would you like to teach?</h1>
        <p class="lede">Describe your lesson in a sentence. Stackyard builds a set of cards you can play with the class.</p>

        <label class="field-label" for="sentence">Your sentence</label>
        <textarea id="sentence" class="sentence" placeholder="A 10-card quiz about the Vikings in Ireland, the right answer plays a cheer"></textarea>

        <div class="actions">
          <button class="build-btn" type="button" disabled aria-disabled="true">Build Cards</button>
          <span class="hint">Type a sentence to begin.</span>
        </div>
      </div>
    </section>
  </main>

  <div class="sr-only" aria-live="polite"></div>
</div>
</body>
</html>
