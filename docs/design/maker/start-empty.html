<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stackyard — Start (empty)</title>
<style>
/* ============================================================
   Stackyard — Stamp Pad design system (design-system.md)
   Static mockup. No build step, no framework, no external URLs.
   Fonts are self-hosted woff2 subsets in ./fonts (offline-safe).
   ============================================================ */
/* Fonts: Bricolage Grotesque (c)2022 Bricolage Project Authors, OFL-1.1, no RFN.
   'Stackyard Reading' = Latin subset of Atkinson Hyperlegible (c)2020 Braille
   Institute, OFL-1.1 with Reserved Font Names 'Atkinson'/'Hyperlegible'; the
   subset is a Modified Version, renamed to avoid the RFN. See fonts/OFL-*.txt. */
@font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:700 800; font-display:swap; src:url('fonts/bricolage.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/reading-400.woff2') format('woff2'); }
@font-face { font-family:'Stackyard Reading'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/reading-700.woff2') format('woff2'); }

:root {
  --color-paper:#FBF8F1; --color-ink:#1E2A47; --color-rule:#C9D3E3;
  --color-stamp:#CE3926; --color-stamp-hover:#B8321F;
  --color-tile-a:#F2735F; --color-tile-b:#F6C744; --color-tile-c:#26A69A; --color-tile-d:#1E2A47;
  --color-white:#FFFFFF; --color-desk:#C9A47C; --shell-sub:#E0E6F0;
  --radius-card:10px; --radius-tile:12px; --radius-button:10px;
  --text-question:44px; --text-tile:32px; --text-body:22px; --text-meta:20px;
  --font-head:'Bricolage Grotesque','Arial Black','Helvetica Neue',Arial,sans-serif;
  --font-body:'Stackyard Reading','Atkinson Hyperlegible','Arial',sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
button, input, select, textarea { font: inherit; color: inherit; }
html, body { height:100%; background:var(--color-paper); color:var(--color-ink); font-family:var(--font-body); font-size:18px; -webkit-font-smoothing:antialiased; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--color-ink); outline-offset:2px; }

.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.topbar { flex:0 0 auto; background:var(--color-ink); display:flex; align-items:center; gap:18px; height:56px; padding:0 28px; }
.wordmark { font-family:var(--font-head); font-weight:800; font-size:30px; color:var(--color-paper); line-height:1; flex-shrink:0; }
.topbar .promise { font-family:var(--font-body); font-weight:400; font-size:18px; color:var(--shell-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.start-area { flex:1 1 auto; background:var(--color-desk); background-image:repeating-linear-gradient(90deg, rgba(30,42,71,.025) 0 2px, transparent 2px 9px); display:flex; align-items:center; justify-content:center; padding:32px; overflow:hidden; min-height:0; }

/* Stage holds the input card on top and the result stack peeking out behind */
.stage { position:relative; width:760px; max-width:94vw; }

/* The result stack peeking out to the lower-right of the sentence card.
   Anchored to the card (not the window) so it stays visible at any size,
   with its top two answer tiles fully in view: sentence in -> cards out. */
.peek { position:absolute; right:-232px; top:150px; width:560px; z-index:0; pointer-events:none; }
.peek-card { position:relative; width:560px; height:300px; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:0 2px 0 rgba(30,42,71,.10); overflow:hidden; padding:28px 32px; }
.peek-card::after { content:''; position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px); background-position:0 32px; }
.peek-edge { position:absolute; left:0; width:560px; height:300px; border-radius:var(--radius-card); border:1px solid #D8CDB6; }
.peek-edge-1 { top:8px; left:8px; background:#EDE6D6; z-index:-1; }
/* Meta line on the peek card (not the question): it can't be cut mid-word. */
.peek-meta { position:relative; z-index:1; font-family:var(--font-body); font-weight:400; font-size:20px; line-height:1.5; color:var(--color-ink); margin-bottom:20px; }
.peek-tiles { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.peek-tile { display:flex; align-items:center; gap:10px; min-height:56px; border-radius:var(--radius-tile); padding:0 16px; font-family:var(--font-body); font-weight:700; font-size:24px; }
.peek-tile svg { flex-shrink:0; }

/* The sentence card sits on top */
.start-card { position:relative; z-index:3; width:720px; max-width:92vw; background:var(--color-paper); border:1px solid var(--color-rule); border-radius:var(--radius-card); box-shadow:0 2px 0 rgba(30,42,71,.10); padding:48px 48px 40px; }
.start-card::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:0; border-radius:var(--radius-card); background-image:repeating-linear-gradient(to bottom,transparent 0px,transparent 31px,var(--color-rule) 31px,var(--color-rule) 32px); background-position:0 40px; background-size:100% calc(100% - 40px); }
.start-rings { position:absolute; top:-22px; left:0; width:100%; display:flex; justify-content:center; gap:300px; z-index:4; }
.start-ring svg { display:block; }
.start-inner { position:relative; z-index:3; }

.start-card h1 { font-family:var(--font-head); font-weight:800; font-size:var(--text-question); line-height:1.2; margin-bottom:10px; }
.start-card p.lede { font-size:var(--text-body); line-height:1.5; margin-bottom:22px; color:var(--color-ink); }

label.field-label { display:block; font-size:18px; font-weight:700; margin-bottom:8px; }
.sentence { width:100%; min-height:80px; resize:vertical; font-family:var(--font-body); font-size:var(--text-body); line-height:1.5; color:var(--color-ink); background:#fff; border:1.5px solid var(--color-ink); border-radius:var(--radius-button); padding:14px 16px; }

/* Example tabs styled like index-card tabs */
.examples { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.example-tab { display:inline-flex; align-items:center; min-height:44px; background:var(--color-paper); border:1.5px solid var(--color-rule); border-bottom-width:4px; border-radius:10px 10px 4px 4px; color:var(--color-ink); font-family:var(--font-body); font-weight:700; font-size:18px; padding:8px 16px; cursor:pointer; }
.example-tab:hover { border-color:var(--color-ink); }

.actions { display:flex; align-items:center; gap:16px; margin-top:22px; }
.build-btn { background:var(--color-ink); color:var(--color-paper); border:none; border-radius:var(--radius-button); padding:14px 28px; font-family:var(--font-body); font-weight:700; font-size:18px; cursor:pointer; min-height:44px; }
.hint { font-size:18px; color:#4a5878; line-height:1.4; }

.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="wordmark">Stackyard</span>
    <span class="promise">Make a clickable lesson from one sentence. Works offline.</span>
  </header>

  <main class="start-area">
    <div class="stage">
      <!-- The result stack peeking out underneath: sentence in -> cards out -->
      <div class="peek" aria-hidden="true">
        <div class="peek-edge peek-edge-1"></div>
        <div class="peek-card">
          <p class="peek-meta">Card 3 of 10</p>
          <div class="peek-tiles">
            <span class="peek-tile" style="background:var(--color-tile-a); color:var(--color-ink);"><svg width="22" height="22" viewBox="0 0 28 28"><polygon points="14,2 26,26 2,26" fill="currentColor"/></svg> Dublin</span>
            <span class="peek-tile" style="background:var(--color-tile-b); color:var(--color-ink);"><svg width="22" height="22" viewBox="0 0 28 28"><polygon points="14,2 26,14 14,26 2,14" fill="currentColor"/></svg> Cork</span>
            <span class="peek-tile" style="background:var(--color-tile-c); color:var(--color-ink);"><svg width="22" height="22" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="currentColor"/></svg> Galway</span>
            <span class="peek-tile" style="background:var(--color-tile-d); color:var(--color-white);"><svg width="22" height="22" viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24" fill="currentColor"/></svg> Sligo</span>
          </div>
        </div>
      </div>

      <section class="start-card" aria-label="Start a new set of cards">
        <div class="start-rings" aria-hidden="true">
          <span class="start-ring"><svg width="26" height="52" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
          <span class="start-ring"><svg width="26" height="52" viewBox="0 0 26 52"><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#1E2A47" stroke-opacity="0.55" stroke-width="3.5"/><ellipse cx="13" cy="26" rx="8" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1"/><ellipse cx="13" cy="40" rx="7" ry="6" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1"/></svg></span>
        </div>
        <div class="start-inner">
          <h1>What would you like to teach?</h1>
          <p class="lede">Describe your lesson in a sentence. Stackyard builds a set of cards you can play with the class.</p>

          <label class="field-label" for="sentence">Your sentence</label>
          <textarea id="sentence" class="sentence" aria-label="Your sentence">A 10-card quiz about the Vikings in Ireland, the right answer plays a cheer</textarea>

          <div class="examples" aria-label="Or start from an example">
            <button class="example-tab" type="button">Vikings in Ireland quiz</button>
            <button class="example-tab" type="button">Times tables game</button>
            <button class="example-tab" type="button">Irish words flashcards</button>
          </div>

          <div class="actions">
            <button class="build-btn" type="button">Build Cards</button>
            <span class="hint">Or tap an example to fill it in.</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="sr-only" aria-live="polite"></div>
</div>
</body>
</html>
